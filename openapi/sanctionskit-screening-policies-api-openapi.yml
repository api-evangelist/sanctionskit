components:
  schemas:
    ScreeningPolicySnapshot:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        purpose:
          type: string
          minLength: 3
          maxLength: 1000
        jurisdictions:
          minItems: 1
          maxItems: 30
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 100
        matching:
          type: object
          properties:
            profile:
              type: string
              enum:
              - standard
              - focused
          required:
          - profile
          additionalProperties: false
        requiredSources:
          default: {}
          type: object
          propertyNames:
            type: string
            enum:
            - person
            - organization
            - vessel
            - aircraft
            - other
          additionalProperties:
            maxItems: 512
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 80
        optionalSources:
          default: {}
          type: object
          propertyNames:
            type: string
            enum:
            - person
            - organization
            - vessel
            - aircraft
            - other
          additionalProperties:
            maxItems: 512
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 80
        exclusions:
          default: []
          maxItems: 30
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 500
        externalChecks:
          default: []
          maxItems: 20
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 200
        externalCheckGuidance:
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 3
                maxLength: 200
              instructions:
                type: string
                minLength: 3
                maxLength: 2000
              evidenceExample:
                type: string
                minLength: 3
                maxLength: 1000
            required:
            - label
            - instructions
            additionalProperties: false
        review:
          default: {}
          type: object
          properties:
            requireSecondReview:
              default: false
              type: boolean
            secondReviewFor:
              default: []
              maxItems: 4
              type: array
              items:
                type: string
                enum:
                - same_identity
                - allow
                - restrict
                - escalate
            approverRoles:
              default:
              - owner
              - admin
              - analyst
              minItems: 1
              maxItems: 3
              type: array
              items:
                type: string
                enum:
                - owner
                - admin
                - analyst
          additionalProperties: false
        monitoringIntervalHours:
          default: 24
          anyOf:
          - type: number
            const: 6
          - type: number
            const: 24
          - type: number
            const: 168
        retentionTrigger:
          default: review_completed
          type: string
          enum:
          - review_completed
          - relationship_ended
          - business_event
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        environment:
          type: string
          enum:
          - sandbox
          - production
        createdAt:
          type: string
          format: date-time
      required:
      - name
      - purpose
      - jurisdictions
      - requiredSources
      - optionalSources
      - exclusions
      - externalChecks
      - review
      - monitoringIntervalHours
      - retentionTrigger
      - id
      - version
      - environment
      - createdAt
      additionalProperties: false
    PolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningPolicySnapshot'
        requirePolicy:
          type: boolean
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - requirePolicy
      - nextCursor
    Error:
      type: object
      required:
      - error
      description: Failure envelope for every documented non-2xx API response. No data property is returned. Switch on error.code; messages may change.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: Machine-readable failure code. See this operation’s status-specific examples for codes and recovery.
            message:
              type: string
              description: Human-readable explanation. Do not parse this text to control application behavior.
            requestId:
              type: string
              format: uuid
              description: Server correlation ID, also returned in X-Request-Id. Include this ID in support requests.
            details:
              description: Optional JSON details for client and validation failures. Validation failures return an array of { path, message } issues; other 4xx codes may return a code-specific object. Server failures omit details. Never assume this key is present.
              anyOf:
              - type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - path
                  - message
                  properties:
                    path:
                      type: string
                      maxLength: 160
                      description: Dot-separated invalid field path, including array indexes.
                    message:
                      type: string
                      maxLength: 300
                      description: Validation problem for this field.
              - type: object
