components:
  schemas:
    WebhookRetry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - sandbox
          - production
        status:
          const: pending
      required:
      - id
      - environment
      - status
    Webhooks:
      type: object
      properties:
        endpoints:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              environment:
                type: string
                enum:
                - sandbox
                - production
              url:
                type: string
              active:
                type: boolean
              created_at:
                type: string
                format: date-time
            required:
            - id
            - environment
            - url
            - active
            - created_at
        deliveries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              environment:
                type: string
                enum:
                - sandbox
                - production
              endpoint_id:
                type: string
                format: uuid
              event_id:
                type: string
              status:
                type: string
              attempts:
                type: integer
                minimum: 0
              next_attempt_at:
                type: string
                format: date-time
              last_status:
                anyOf:
                - type: integer
                  minimum: 0
                - type: 'null'
              created_at:
                type: string
                format: date-time
            required:
            - id
            - environment
            - endpoint_id
            - event_id
            - status
            - attempts
            - next_attempt_at
            - last_status
            - created_at
      required:
      - endpoints
      - deliveries
    WebhookRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
          format: uri
          description: HTTPS endpoint that receives signed events. Public DNS resolution and destination restrictions apply; local/private addresses and redirects are rejected. At most five active endpoints per environment.
      required:
      - url
      additionalProperties: false
    WebhookCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - sandbox
          - production
        url:
          type: string
        secret:
          type: string
          description: Signing secret shown only at creation. Store securely and use it to verify webhook signatures; list operations never return it.
      required:
      - id
      - environment
      - url
      - secret
    Error:
      type: object
      required:
      - error
      description: Failure envelope for every documented non-2xx API response. No data property is returned. Switch on error.code; messages may change.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: Machine-readable failure code. See this operation’s status-specific examples for codes and recovery.
            message:
              type: string
              description: Human-readable explanation. Do not parse this text to control application behavior.
            requestId:
              type: string
              format: uuid
              description: Server correlation ID, also returned in X-Request-Id. Include this ID in support requests.
            details:
              description: Optional JSON details for client and validation failures. Validation failures return an array of { path, message } issues; other 4xx codes may return a code-specific object. Server failures omit details. Never assume this key is present.
              anyOf:
              - type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - path
                  - message
                  properties:
                    path:
                      type: string
                      maxLength: 160
                      description: Dot-separated invalid field path, including array indexes.
                    message:
                      type: string
                      maxLength: 300
                      description: Validation problem for this field.
              - type: object
                additionalProperties: true
              - type:
                - string
                - number
                - boolean
                - 'null'
            detailsTruncated:
              type: boolean
              description: True when only the first 50 validation issues are returned. Validation paths and messages are bounded.
    WebhookDisabled:
      type: object
      properties:
        id:
          type: string
          format: uuid
        environment:
          type: string
          enum:
          - sandbox
          - production
        active:
          const: false
      required:
      - id
      - environment
      - active
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_test_... or sk_live_...
