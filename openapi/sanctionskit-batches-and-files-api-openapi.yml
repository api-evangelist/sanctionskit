openapi: 3.2.0
info:
  title: SanctionsKit Batches and files API
  version: 1.0.0
  description: Explore success and error examples without an account or API key. Recorded examples use isolated synthetic application data; remaining examples are labeled contract fixtures. Potential-match screening is for review. No-match is limited to selected, qualified sources. Sandbox uses synthetic records and is never billed. Each successfully completed subject consumes one allowance unit, including monitoring rescreens. Failed rows and idempotent retries do not consume additional units.
servers:
- url: /api/v1
  description: This site origin; deployment configuration and access rules apply
tags:
- name: Batches and files
paths:
  /batches:
    get:
      operationId: get__batches
      summary: List batches with progress
      tags:
      - Batches and files
      description: 'Required API key scope: results:read.'
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        description: Maximum number of items to return. A response may contain fewer items; use its next cursor to decide whether another page exists.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: cursor
        description: Pass nextCursor from the previous page; omit for the first page. Continue until the response cursor is null. Keep the same filters between pages.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          headers:
            X-Request-Id:
              description: Server-generated request correlation identifier.
              schema:
                type: string
                format: uuid
          description: Successful response. JSON object with the required data key. All properties marked required are present, including keys whose value may be null. Unmarked properties can be omitted; clients should tolerate additional response properties.
          content:
            application/json:
              examples:
                recorded_page:
                  summary: A page of synthetic batches
                  description: Recorded from the real application handler against an isolated synthetic database. IDs, times and nonfunctional temporary secrets are normalized. No customer data or live provider request.
                  value:
                    data:
                      items:
                      - id: 00000000-0000-4000-8000-000000000001
                        environment: sandbox
                        name: Synthetic documentation batch
                        status: pending
                        total: 1
                        completed: 0
                        failed: 0
                        cancelled_at: null
                        created_at: '2026-09-17T12:00:00.000Z'
                      nextCursor: null
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BatchPage'
        '400':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**invalid_request** — Correct the request fields, resource identifiers, JSON body or query parameters before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: invalid request
                  description: Synthetic error example. Correct the request fields, resource identifiers, JSON body or query parameters before retrying.
                  value:
                    error:
                      code: invalid_request
                      message: The request is invalid.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '401':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge.
          description: '**authentication_required** — Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.


            **invalid_api_key** — Use an active key for the intended environment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  summary: authentication required
                  description: 'Synthetic error example. Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.'
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_api_key:
                  summary: invalid api key
                  description: Synthetic error example. Use an active key for the intended environment.
                  value:
                    error:
                      code: invalid_api_key
                      message: The API key is invalid, expired, or revoked.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '403':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**permission_denied** — Ask an organization owner to grant the required role or API-key scope.


            **insufficient_scope** — Use a key with the scope stated in this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permission_denied:
                  summary: permission denied
                  description: Synthetic error example. Ask an organization owner to grant the required role or API-key scope.
                  value:
                    error:
                      code: permission_denied
                      message: Your role does not allow this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                insufficient_scope:
                  summary: insufficient scope
                  description: Synthetic error example. Use a key with the scope stated in this operation.
                  value:
                    error:
                      code: insufficient_scope
                      message: The API key does not grant this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '405':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Allow:
              schema:
                type: string
              description: Comma-separated supported HTTP methods.
          description: '**method_not_allowed** — Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                method_not_allowed:
                  summary: method not allowed
                  description: Synthetic error example. Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.
                  value:
                    error:
                      code: method_not_allowed
                      message: This method is not supported for this endpoint.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '413':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**response_too_large** — Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                response_too_large:
                  summary: response too large
                  description: Synthetic error example. Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.
                  value:
                    error:
                      code: response_too_large
                      message: This response exceeds the size limit. Request a smaller page or a segmented export.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '429':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**rate_limited** — Wait for the request window to reset and retry with backoff.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: rate limited
                  description: Synthetic error example. Wait for the request window to reset and retry with backoff.
                  value:
                    error:
                      code: rate_limited
                      message: The per-minute request limit has been reached.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '500':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**internal_error** — Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal error
                  description: Synthetic error example. Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.
                  value:
                    error:
                      code: internal_error
                      message: The request could not be completed.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '503':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**temporarily_unavailable** — Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                temporarily_unavailable:
                  summary: temporarily unavailable
                  description: Synthetic error example. Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The service is temporarily unavailable. Retry shortly.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
    post:
      operationId: post__batches
      summary: Accept up to 100 inline requests or an authorized private upload
      tags:
      - Batches and files
      description: 'Required API key scope: batches:write.


        All batch rows require standard retention, including uploaded JSONL. Explicit minimal rows are rejected. Uploaded inputs are temporary for 24 hours; resulting screening records follow the workspace and case retention policy.'
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[\w:.-]{8,128}$
        description: Reuse for identical retries. Reuse with different input returns 409.
      requestBody:
        required: true
        description: 'JSON request body. Send Content-Type: application/json with UTF-8 encoding; fields marked required must be present. Omit optional fields unless needed. Null is accepted only where explicitly shown. Unknown properties are rejected for validated request objects. Duplicate keys and nesting beyond 32 levels are rejected. Maximum body size: 1,048,576 bytes (1 MiB).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              name: Synthetic example batch
              subjects:
              - subject:
                  name: Alex Morgan
                  entityType: person
                package: sandbox@1
                retention: standard
      responses:
        '202':
          headers:
            X-Request-Id:
              description: Server-generated request correlation identifier.
              schema:
                type: string
                format: uuid
          description: Accepted for asynchronous processing. This does not establish completed work. JSON object with the required data key. All properties marked required are present, including keys whose value may be null. Unmarked properties can be omitted; clients should tolerate additional response properties.
          content:
            application/json:
              examples:
                recorded_accepted:
                  summary: A synthetic batch queued for processing
                  description: Recorded from the real application handler against an isolated synthetic database. IDs, times and nonfunctional temporary secrets are normalized. No customer data or live provider request.
                  value:
                    data:
                      id: 00000000-0000-4000-8000-000000000001
                      status: pending
                      total: 1
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BatchAccepted'
        '400':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**invalid_request** — Correct the request fields, resource identifiers, JSON body or query parameters before retrying.


            **idempotency_key_required** — Include an Idempotency-Key matching this operation’s documented format.


            **sandbox_coverage_required** — Use package sandbox@1 in the sandbox; choose approved sources or a qualified package in production.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: invalid request
                  description: Synthetic error example. Correct the request fields, resource identifiers, JSON body or query parameters before retrying.
                  value:
                    error:
                      code: invalid_request
                      message: The request is invalid.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                idempotency_key_required:
                  summary: idempotency key required
                  description: Synthetic error example. Include an Idempotency-Key matching this operation’s documented format.
                  value:
                    error:
                      code: idempotency_key_required
                      message: Provide an Idempotency-Key of 8 to 128 URL-safe characters.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                sandbox_coverage_required:
                  summary: sandbox coverage required
                  description: Synthetic error example. Use package sandbox@1 in the sandbox; choose approved sources or a qualified package in production.
                  value:
                    error:
                      code: sandbox_coverage_required
                      message: Sandbox accepts only the explicitly synthetic sandbox@1 package.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '401':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge.
          description: '**authentication_required** — Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.


            **invalid_api_key** — Use an active key for the intended environment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  summary: authentication required
                  description: 'Synthetic error example. Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.'
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_api_key:
                  summary: invalid api key
                  description: Synthetic error example. Use an active key for the intended environment.
                  value:
                    error:
                      code: invalid_api_key
                      message: The API key is invalid, expired, or revoked.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '402':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**subscription_required** — Use the synthetic sandbox or arrange an active production subscription before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                subscription_required:
                  summary: subscription required
                  description: Synthetic error example. Use the synthetic sandbox or arrange an active production subscription before retrying.
                  value:
                    error:
                      code: subscription_required
                      message: An active subscription is required for production screening.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '403':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**permission_denied** — Ask an organization owner to grant the required role or API-key scope.


            **insufficient_scope** — Use a key with the scope stated in this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permission_denied:
                  summary: permission denied
                  description: Synthetic error example. Ask an organization owner to grant the required role or API-key scope.
                  value:
                    error:
                      code: permission_denied
                      message: Your role does not allow this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                insufficient_scope:
                  summary: insufficient scope
                  description: Synthetic error example. Use a key with the scope stated in this operation.
                  value:
                    error:
                      code: insufficient_scope
                      message: The API key does not grant this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '404':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**not_found** — Check the identifier and selected environment. The resource must belong to your organization and remain available.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  summary: not found
                  description: Synthetic error example. Check the identifier and selected environment. The resource must belong to your organization and remain available.
                  value:
                    error:
                      code: not_found
                      message: Counterparty not found.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '405':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Allow:
              schema:
                type: string
              description: Comma-separated supported HTTP methods.
          description: '**method_not_allowed** — Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                method_not_allowed:
                  summary: method not allowed
                  description: Synthetic error example. Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.
                  value:
                    error:
                      code: method_not_allowed
                      message: This method is not supported for this endpoint.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '408':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**invalid_request** — Reconnect and retry using the same idempotency key and identical input where supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: invalid request
                  description: Synthetic error example. Reconnect and retry using the same idempotency key and identical input where supported.
                  value:
                    error:
                      code: invalid_request
                      message: The request body was not received within 10 seconds.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '409':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**idempotency_conflict** — Reuse a key only with identical input. Use a new key for genuinely new work.


            **screening_policy_changed** — Reload GET /policies and use the current version after reviewing its coverage.


            **upload_unavailable** — Create and complete a new authorized upload before submitting its uploadId.


            **counterparty_archived** — Restore the active identity or omit the optional counterparty link.


            **counterparty_changed** — Reload the counterparty and use its current subject; names do not automatically merge identities.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotency_conflict:
                  summary: idempotency conflict
                  description: Synthetic error example. Reuse a key only with identical input. Use a new key for genuinely new work.
                  value:
                    error:
                      code: idempotency_conflict
                      message: This idempotency key was used with a different request.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                screening_policy_changed:
                  summary: screening policy changed
                  description: Synthetic error example. Reload GET /policies and use the current version after reviewing its coverage.
                  value:
                    error:
                      code: screening_policy_changed
                      message: The policy has a newer version. Review its coverage before screening again.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                upload_unavailable:
                  summary: upload unavailable
                  description: Synthetic error example. Create and complete a new authorized upload before submitting its uploadId.
                  value:
                    error:
                      code: upload_unavailable
                      message: The upload is missing, expired, already used, or incomplete.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                counterparty_archived:
                  summary: counterparty archived
                  description: Synthetic error example. Restore the active identity or omit the optional counterparty link.
                  value:
                    error:
                      code: counterparty_archived
                      message: Restore this counterparty before screening it.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                counterparty_changed:
                  summary: counterparty changed
                  description: Synthetic error example. Reload the counterparty and use its current subject; names do not automatically merge identities.
                  value:
                    error:
                      code: counterparty_changed
                      message: Screening input differs from the current counterparty identity.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '413':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**response_too_large** — Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.


            **invalid_request** — Reduce the JSON request size to the documented limit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                response_too_large:
                  summary: response too large
                  description: Synthetic error example. Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.
                  value:
                    error:
                      code: response_too_large
                      message: This response exceeds the size limit. Request a smaller page or a segmented export.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_request:
                  summary: invalid request
                  description: Synthetic error example. Reduce the JSON request size to the documented limit.
                  value:
                    error:
                      code: invalid_request
                      message: REQUEST_TOO_LARGE
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '415':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**invalid_request** — Use Content-Type: application/json and an uncompressed UTF-8 body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: invalid request
                  description: 'Synthetic error example. Use Content-Type: application/json and an uncompressed UTF-8 body.'
                  value:
                    error:
                      code: invalid_request
                      message: Send application/json with UTF-8 encoding.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '422':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**screening_policy_required** — Load GET /policies and supply the current id and version with the required coverage.


            **policy_entity_type_unsupported** — Choose an approved policy with required sources for this subject type.


            **policy_coverage_mismatch** — For production policy-based requests use explicit sources, include all required sources and only permitted optional sources; do not substitute a package.


            **screening_policy_unavailable** — Reload the current policy before retrying. Do not substitute a different scope silently.


            **invalid_coverage** — Check GET /sources and select coverage available to the requested environment and subject type.


            **unsupported_entity_type** — Check source capabilities and remove incompatible sources, or choose coverage for this subject type.


            **matching_variant_limit** — Provide a more precise name or identifier and retry.


            **candidate_limit_exceeded** — Add reliable identifying information before screening again. No all-clear result was produced.


            **retained_screening_required** — Use standard retention or omit retention on every batch row.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                screening_policy_required:
                  summary: screening policy required
                  description: Synthetic error example. Load GET /policies and supply the current id and version with the required coverage.
                  value:
                    error:
                      code: screening_policy_required
                      message: Choose an approved organization screening policy.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                policy_entity_type_unsupported:
                  summary: policy entity type unsupported
                  description: Synthetic error example. Choose an approved policy with required sources for this subject type.
                  value:
                    error:
                      code: policy_entity_type_unsupported
                      message: This policy has no required coverage for the selected subject type.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                policy_coverage_mismatch:
                  summary: policy coverage mismatch
                  description: Synthetic error example. For production policy-based requests use explicit sources, include all required sources and only permitted optional sources; do not substitute a package.
                  value:
                    error:
                      code: policy_coverage_mismatch
                      message: Include every required source and only permitted optional sources for this policy.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                screening_policy_unavailable:
                  summary: screening policy unavailable
                  description: Synthetic error example. Reload the current policy before retrying. Do not substitute a different scope silently.
                  value:
                    error:
                      code: screening_policy_unavailable
                      message: The selected policy version is unavailable.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_coverage:
                  summary: invalid coverage
                  description: Synthetic error example. Check GET /sources and select coverage available to the requested environment and subject type.
                  value:
                    error:
                      code: invalid_coverage
                      message: Choose a supported coverage package or explicit sources.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                unsupported_entity_type:
                  summary: unsupported entity type
                  description: Synthetic error example. Check source capabilities and remove incompatible sources, or choose coverage for this subject type.
