                  description: Synthetic error example. Correct the request fields, resource identifiers, JSON body or query parameters before retrying.
                  value:
                    error:
                      code: invalid_request
                      message: The request is invalid.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '401':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge.
          description: '**authentication_required** — Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.


            **invalid_api_key** — Use an active key for the intended environment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  summary: authentication required
                  description: 'Synthetic error example. Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.'
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_api_key:
                  summary: invalid api key
                  description: Synthetic error example. Use an active key for the intended environment.
                  value:
                    error:
                      code: invalid_api_key
                      message: The API key is invalid, expired, or revoked.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '403':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**permission_denied** — Ask an organization owner to grant the required role or API-key scope.


            **insufficient_scope** — Use a key with the scope stated in this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permission_denied:
                  summary: permission denied
                  description: Synthetic error example. Ask an organization owner to grant the required role or API-key scope.
                  value:
                    error:
                      code: permission_denied
                      message: Your role does not allow this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                insufficient_scope:
                  summary: insufficient scope
                  description: Synthetic error example. Use a key with the scope stated in this operation.
                  value:
                    error:
                      code: insufficient_scope
                      message: The API key does not grant this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '404':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**not_found** — Check the identifier and selected environment. The resource must belong to your organization and remain available.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  summary: not found
                  description: Synthetic error example. Check the identifier and selected environment. The resource must belong to your organization and remain available.
                  value:
                    error:
                      code: not_found
                      message: File not found.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '405':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Allow:
              schema:
                type: string
              description: Comma-separated supported HTTP methods.
          description: '**method_not_allowed** — Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                method_not_allowed:
                  summary: method not allowed
                  description: Synthetic error example. Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.
                  value:
                    error:
                      code: method_not_allowed
                      message: This method is not supported for this endpoint.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '413':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**response_too_large** — Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                response_too_large:
                  summary: response too large
                  description: Synthetic error example. Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.
                  value:
                    error:
                      code: response_too_large
                      message: This response exceeds the size limit. Request a smaller page or a segmented export.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '429':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**rate_limited** — Wait for the request window to reset and retry with backoff.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: rate limited
                  description: Synthetic error example. Wait for the request window to reset and retry with backoff.
                  value:
                    error:
                      code: rate_limited
                      message: The per-minute request limit has been reached.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '500':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**internal_error** — Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal error
                  description: Synthetic error example. Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.
                  value:
                    error:
                      code: internal_error
                      message: The request could not be completed.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '503':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**temporarily_unavailable** — Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                temporarily_unavailable:
                  summary: temporarily unavailable
                  description: Synthetic error example. Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The service is temporarily unavailable. Retry shortly.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
components:
  schemas:
    UploadTokenResponse:
      type: object
      properties:
        type:
          const: blob.generate-client-token
        clientToken:
          type: string
          description: Short-lived private upload token. Treat it as a secret and pass it only to the authorized upload client; do not log it.
      required:
      - type
      - clientToken
    ScreeningRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        subject:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 300
              description: Name to compare with publisher records. Leading and trailing whitespace is removed; provide the fullest reliable name available.
            entityType:
              default: person
              type: string
              enum:
              - person
              - organization
              - vessel
              - aircraft
              - other
              description: Type of subject. Defaults to person when omitted. Every selected source must support this type.
            identifiers:
              default: []
              maxItems: 20
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    minLength: 1
                    maxLength: 80
                    description: Identifier scheme, such as passport, national_id, registration, lei, imo or mmsi. Matching normalizes supported scheme aliases.
                  value:
                    type: string
                    minLength: 1
                    maxLength: 160
                    description: Identifier value. Send the original value; scheme-specific normalization is applied during matching.
                  issuer:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: Optional issuing authority or country. Omit when unknown; do not send null.
                required:
                - type
                - value
                additionalProperties: false
              description: Typed identifiers used for exact matching, such as passport, national_id, registration, lei, imo or mmsi. Defaults to an empty array. Use the publisher’s identifier scheme; custom scheme names are accepted.
            birthDate:
              anyOf:
              - type: string
                pattern: ^(?!0000)\d{4}$
              - type: string
                pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
              - type: string
                allOf:
                - pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                - pattern: ^(?!0000)
              description: 'Known date or partial date: YYYY, YYYY-MM or YYYY-MM-DD. Preserve known precision; do not invent a month or day. Year 0000 and invalid dates are rejected.'
            country:
              type: string
              minLength: 2
              maxLength: 100
              description: Known country name or code used as supporting identity evidence. It is not a source-selection or geographic coverage filter.
          required:
          - name
          additionalProperties: false
          description: Identity to screen. name is required; entityType defaults to person and identifiers defaults to an empty array.
        counterpartyId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Optional existing active counterparty UUID in the same organization and environment. The submitted subject must match its current identity; this does not create a counterparty.
        policy:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              description: Policy UUID from GET /policies.
            version:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
              description: Exact approved policy version from GET /policies. Reload the policy if that version is no longer available.
          required:
          - id
          - version
          additionalProperties: false
          description: Approved organization policy reference. Required when GET /policies returns requirePolicy=true. A supplied policy must be current and compatible with the subject and requested coverage.
          x-required-when: GET /policies returns requirePolicy=true for the current API key environment.
        reference:
          type: string
          maxLength: 160
          description: Optional caller reference (up to 160 characters). It is retained with standard evidence and returned by GET /results/{id}; it is null in minimal-retention retrieval.
        sources:
          minItems: 1
          maxItems: 512
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: Explicit source IDs from GET /sources. Provide sources or package, exactly one. Every selected source must be available, fresh and support the subject type; unavailable coverage fails closed.
        package:
          type: string
          minLength: 1
          maxLength: 80
          description: One versioned coverage package, mutually exclusive with sources. Sandbox accepts only sandbox@1. Use only a package available to the selected environment; no implicit global coverage is applied.
        retention:
          default: standard
          type: string
          enum:
          - standard
          - minimal
          description: standard retains inputs and evidence under organization/case policy. minimal is available only for individual API-key screenings, lasts 24 hours, omits submitted inputs, and cannot create a review case. Governance requirements can require standard. Defaults to standard.
      required:
      - subject
      additionalProperties: false
      oneOf:
      - required:
        - sources
        not:
          required:
          - package
      - required:
        - package
        not:
          required:
          - sources
      description: Single subject input. Exactly one of sources or package is required. Only subject is unconditionally required; coverage and approved policy also have conditional requirements described below.
    BatchAccepted:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Accepted batch UUID. Poll GET /batches/{id} for processing progress.
        status:
          type: string
          enum:
          - importing
          - pending
          description: pending for inline rows; importing for an uploaded file. Idempotent replay returns the original acceptance state.
        total:
          type: integer
          minimum: 0
          description: Inline row count; zero for uploads until asynchronous import establishes the count.
      required:
      - id
      - status
      - total
    BatchRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Human-readable batch label. Leading and trailing whitespace is removed.
        subjects:
          minItems: 1
          maxItems: 100
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ScreeningRequest'
            - type: object
              properties:
                retention:
                  const: standard
          description: One to 100 complete ScreeningRequest objects. Each row chooses its own coverage and must use standard retention (or omit retention). Supply subjects or uploadId, exactly one.
        uploadId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: UUID returned by POST /uploads/intent after its private NDJSON upload has completed and passed validation. The file must be ready, unexpired and unused. Mutually exclusive with subjects; uploaded files support up to 10,000 request rows.
      required:
      - name
      additionalProperties: false
      oneOf:
      - required:
        - subjects
        not:
          required:
          - uploadId
      - required:
        - uploadId
        not:
          required:
          - subjects
      description: Batch input. Exactly one of subjects or uploadId is required in addition to name. Every row uses standard retention.
    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        environment:
          type: string
          enum:
          - sandbox
          - production
        status:
          type: string
          enum:
          - importing
          - pending
          - processing
          - completed
          - cancelled
          - failed
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - name
      - environment
      - status
      - total
      - completed
      - failed
      - created_at
      - cancelled_at
    UploadIntent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pathname:
          type: string
        access:
          const: private
        handleUploadUrl:
          const: /api/v1/uploads
        maxBytes:
          type: integer
          minimum: 0
        reservedBytes:
          type: integer
          minimum: 0
        format:
          type: string
      required:
      - id
      - pathname
      - access
      - handleUploadUrl
      - maxBytes
      - reservedBytes
      - format
    Error:
      type: object
      required:
      - error
      description: Failure envelope for every documented non-2xx API response. No data property is returned. Switch on error.code; messages may change.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: Machine-readable failure code. See this operation’s status-specific examples for codes and recovery.
            message:
              type: string
              description: Human-readable explanation. Do not parse this text to control application behavior.
            requestId:
              type: string
              format: uuid
              description: Server correlation ID, also returned in X-Request-Id. Include this ID in support requests.
            details:
              description: Optional JSON details for client and validation failures. Validation failures return an array of { path, message } issues; other 4xx codes may return a code-specific object. Server failures omit details. Never assume this key is present.
              anyOf:
              - type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - path
                  - message
                  properties:
                    path:
                      type: string
                      maxLength: 160
                      description: Dot-separated invalid field path, including array indexes.
                    message:
                      type: string
                      maxLength: 300
                      description: Validation problem for this field.
              - type: object
                additionalProperties: true
              - type:
                - string
                - number
                - boolean
                - 'null'
            detailsTruncated:
              type: boolean
              description: True when only the first 50 validation issues are returned. Validation paths and messages are bounded.
    BatchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - nextCursor
    UploadIntentRequest:
      type: object
      properties:
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 26214400
          description: Exact UTF-8 byte size of the NDJSON upload. Maximum 26,214,400 bytes (25 MiB). Omission reserves the full maximum for legacy clients. The entire body may also be omitted.
      required: []
      additionalProperties: false
    BatchCancellation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - completed
          - cancelled
          - failed
      required:
      - id
      - status
    BatchDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        environment:
          type: string
          enum:
          - sandbox
          - production
        status:
          type: string
          enum:
          - importing
          - pending
          - processing
          - completed
          - cancelled
          - failed
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        rows:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
                minimum: 1
              status:
                type: string
                enum:
                - pending
                - completed
                - failed
                - cancelled
              screening_id:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              error:
                anyOf:
                - type: object
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                  required:
                  - code
                  - message
                - type: 'null'
            required:
            - row_number
            - status
            - screening_id
            - error
          description: Current row outcomes for this page, ordered by one-based row_number. A failed row contains error; retrieve completed evidence using screening_id.
        nextOffset:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Pass this integer as the next offset. Null means all currently counted rows were returned; an importing batch may not have its final total yet.
      required:
      - id
      - name
      - environment
      - status
      - total
      - completed
      - failed
      - created_at
      - cancelled_at
      - rows
      - nextOffset
    UploadTokenRequest:
      type: object
      properties:
        type:
          const: blob.generate-client-token
          description: Fixed client-token request discriminator.
        payload:
          type: object
          properties:
            pathname:
              type: string
              description: Exact pathname from POST /uploads/intent; it is bound to your organization and key environment.
            clientPayload:
              anyOf:
              - type: string
              - type: 'null'
              description: Client metadata field used by the upload protocol. Send null when no metadata is needed.
            multipart:
              const: false
              description: 'Must be false: only a single bounded private upload is supported.'
          required:
          - pathname
          - clientPayload
          - multipart
          description: Provider client-token payload. Use the exact pathname from the authorized upload intent.
      required:
      - type
      - payload
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_test_... or sk_live_...
