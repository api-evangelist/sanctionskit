  /reports/cases/{id}:
    get:
      operationId: get__reports_cases_id_
      summary: Download a bounded case audit packet in JSON or PDF
      tags:
      - Reports
      description: 'Required API key scope: results:read.


        Includes retained findings, decisions, external-check history, document references and text attachments. Large cases require the segmented archive route. External repository bytes are not copied. This packet is not an immutable or signed archive.'
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Opaque resource identifier owned by the authenticated organization.
      - in: query
        name: format
        schema:
          enum:
          - json
          - pdf
          default: json
        description: Download format. Read the corresponding response Content-Type before decoding.
      responses:
        '200':
          headers:
            X-Request-Id:
              description: Server-generated request correlation identifier.
              schema:
                type: string
                format: uuid
          description: Successful response. The response is the documented raw JSON or file content, without a data envelope. Check Content-Type before decoding.
          content:
            application/json:
              examples:
                recorded_audit_packet:
                  summary: An audit packet containing synthetic retained evidence
                  description: Recorded from the real application handler against an isolated synthetic database. IDs, times and nonfunctional temporary secrets are normalized. No customer data or live provider request.
                  value:
                    documents:
                    - id: 00000000-0000-4000-8000-000000000001
                      title: Synthetic ownership evidence
                      url: https://repository.example.test/records/DOCS-001
                      repository: Synthetic approved repository
                      documentVersion: '1'
                      sha256: null
                      provenance: Obtained by the synthetic reviewer from the authorized repository.
                      verification: unverified
                      verifiedAt: null
                      actorId: docs-synthetic-reviewer
                      createdAt: '2026-09-17T12:00:00.000Z'
                    format: sanctionskit-case-audit@1
                    generatedAt: '2026-09-17T12:00:00.000Z'
                    environment: sandbox
                    investigation:
                      id: 00000000-0000-4000-8000-000000000002
                      screeningId: 00000000-0000-4000-8000-000000000003
                      counterpartyId: 00000000-0000-4000-8000-000000000004
                      decision: dismissed
                      revision: 10
                      assigneeId: null
                      priority: high
                      dueAt: null
                      escalatedAt: null
                      requiresSecondReview: false
                      reviewState: approved
                      businessDisposition: allow
                      reviewStartedAt: '2026-09-17T12:00:00.000Z'
                      supersededByScreeningId: null
                      supersededByCaseId: null
                      approvalRequiredByPolicy: false
                      approvalRequiredForActions: []
                      approverRoles:
                      - owner
                      - admin
                      - analyst
                      reviewConcern: null
                      policyContext:
                        id: 00000000-0000-4000-8000-000000000005
                        version: 1
                        name: Synthetic onboarding policy
                        purpose: Document vendor onboarding checks
                        exclusions: []
                      decisionHistory:
                      - id: 00000000-0000-4000-8000-000000000006
                        decision: dismissed
                        businessDisposition: allow
