components:
  schemas:
    ArchiveFinding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
        environment:
          type: string
        case_id:
          type: string
          format: uuid
        screening_id:
          type: string
          format: uuid
        source_id:
          type: string
        record_id:
          type: string
        field:
          type: string
        value:
          type: string
        source_reference:
          type: string
        verification:
          type: string
        comparison:
          type: string
        notes:
          type: string
        content:
          type: string
        actor_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - organization_id
      - environment
      - case_id
      - screening_id
      - source_id
      - record_id
      - field
      - value
      - source_reference
      - verification
      - comparison
      - notes
      - content
      - actor_id
      - created_at
      - expires_at
      description: Retained record for archive category findings. Keys retain their stored snake_case spelling. Nullable columns are included with null values. Expired records use ArchiveExpiredRecord instead; holdings can omit expired reason text.
    ScreeningRequest:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        subject:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 300
              description: Name to compare with publisher records. Leading and trailing whitespace is removed; provide the fullest reliable name available.
            entityType:
              default: person
              type: string
              enum:
              - person
              - organization
              - vessel
              - aircraft
              - other
              description: Type of subject. Defaults to person when omitted. Every selected source must support this type.
            identifiers:
              default: []
              maxItems: 20
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    minLength: 1
                    maxLength: 80
                    description: Identifier scheme, such as passport, national_id, registration, lei, imo or mmsi. Matching normalizes supported scheme aliases.
                  value:
                    type: string
                    minLength: 1
                    maxLength: 160
                    description: Identifier value. Send the original value; scheme-specific normalization is applied during matching.
                  issuer:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: Optional issuing authority or country. Omit when unknown; do not send null.
                required:
                - type
                - value
                additionalProperties: false
              description: Typed identifiers used for exact matching, such as passport, national_id, registration, lei, imo or mmsi. Defaults to an empty array. Use the publisher’s identifier scheme; custom scheme names are accepted.
            birthDate:
              anyOf:
              - type: string
                pattern: ^(?!0000)\d{4}$
              - type: string
                pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
              - type: string
                allOf:
                - pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                - pattern: ^(?!0000)
              description: 'Known date or partial date: YYYY, YYYY-MM or YYYY-MM-DD. Preserve known precision; do not invent a month or day. Year 0000 and invalid dates are rejected.'
            country:
              type: string
              minLength: 2
              maxLength: 100
              description: Known country name or code used as supporting identity evidence. It is not a source-selection or geographic coverage filter.
          required:
          - name
          additionalProperties: false
          description: Identity to screen. name is required; entityType defaults to person and identifiers defaults to an empty array.
        counterpartyId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Optional existing active counterparty UUID in the same organization and environment. The submitted subject must match its current identity; this does not create a counterparty.
        policy:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              description: Policy UUID from GET /policies.
            version:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
              description: Exact approved policy version from GET /policies. Reload the policy if that version is no longer available.
          required:
          - id
          - version
          additionalProperties: false
          description: Approved organization policy reference. Required when GET /policies returns requirePolicy=true. A supplied policy must be current and compatible with the subject and requested coverage.
          x-required-when: GET /policies returns requirePolicy=true for the current API key environment.
        reference:
          type: string
          maxLength: 160
          description: Optional caller reference (up to 160 characters). It is retained with standard evidence and returned by GET /results/{id}; it is null in minimal-retention retrieval.
        sources:
          minItems: 1
          maxItems: 512
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: Explicit source IDs from GET /sources. Provide sources or package, exactly one. Every selected source must be available, fresh and support the subject type; unavailable coverage fails closed.
        package:
          type: string
          minLength: 1
          maxLength: 80
          description: One versioned coverage package, mutually exclusive with sources. Sandbox accepts only sandbox@1. Use only a package available to the selected environment; no implicit global coverage is applied.
        retention:
          default: standard
          type: string
          enum:
          - standard
          - minimal
          description: standard retains inputs and evidence under organization/case policy. minimal is available only for individual API-key screenings, lasts 24 hours, omits submitted inputs, and cannot create a review case. Governance requirements can require standard. Defaults to standard.
      required:
      - subject
      additionalProperties: false
      oneOf:
      - required:
        - sources
        not:
          required:
          - package
      - required:
        - package
        not:
          required:
          - sources
      description: Single subject input. Exactly one of sources or package is required. Only subject is unconditionally required; coverage and approved policy also have conditional requirements described below.
    MatchAssessment:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          anyOf:
          - type: object
            properties:
              similarity:
                type: integer
                minimum: 0
                maximum: 100
              method:
                type: string
              aliasKind:
                type: string
                enum:
                - primary
                - alias
              aliasQuality:
                type: string
                enum:
                - strong
                - weak
                - unknown
            required:
            - similarity
            - method
            - aliasKind
            - aliasQuality
            additionalProperties: false
          - type: 'null'
        identifiers:
          type: object
          properties:
            status:
              type: string
              enum:
              - agreement
              - conflict
              - not_supplied
              - unavailable
              - not_comparable
            matched:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            issuerAgreements:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            issuerUnknown:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            conflicts:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
          - status
          - matched
          - issuerAgreements
          - issuerUnknown
          - conflicts
          additionalProperties: false
        birthDate:
          type: object
          properties:
            status:
              type: string
              enum:
              - agreement
              - conflict
              - not_supplied
              - unavailable
              - not_comparable
            precision:
              type: string
              enum:
              - year
              - month
              - day
          required:
          - status
          additionalProperties: false
        country:
          type: object
          properties:
            status:
              type: string
              enum:
              - agreement
              - conflict
              - not_supplied
              - unavailable
              - not_comparable
          required:
          - status
          additionalProperties: false
        entityType:
          type: object
          properties:
            status:
              type: string
              enum:
              - agreement
              - conflict
              - not_supplied
              - unavailable
              - not_comparable
          required:
          - status
          additionalProperties: false
        reviewTier:
          type: string
          enum:
          - identifier
          - corroborated
          - conflicting
          - name_only
        alertBasis:
          type: string
          enum:
          - identifier
          - name
          - name_and_birth_date
        hasConflicts:
          type: boolean
        sameNameCandidates:
