    ScreeningPolicySnapshot:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        purpose:
          type: string
          minLength: 3
          maxLength: 1000
        jurisdictions:
          minItems: 1
          maxItems: 30
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 100
        matching:
          type: object
          properties:
            profile:
              type: string
              enum:
              - standard
              - focused
          required:
          - profile
          additionalProperties: false
        requiredSources:
          default: {}
          type: object
          propertyNames:
            type: string
            enum:
            - person
            - organization
            - vessel
            - aircraft
            - other
          additionalProperties:
            maxItems: 512
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 80
        optionalSources:
          default: {}
          type: object
          propertyNames:
            type: string
            enum:
            - person
            - organization
            - vessel
            - aircraft
            - other
          additionalProperties:
            maxItems: 512
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 80
        exclusions:
          default: []
          maxItems: 30
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 500
        externalChecks:
          default: []
          maxItems: 20
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 200
        externalCheckGuidance:
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                minLength: 3
                maxLength: 200
              instructions:
                type: string
                minLength: 3
                maxLength: 2000
              evidenceExample:
                type: string
                minLength: 3
                maxLength: 1000
            required:
            - label
            - instructions
            additionalProperties: false
        review:
          default: {}
          type: object
          properties:
            requireSecondReview:
              default: false
              type: boolean
            secondReviewFor:
              default: []
              maxItems: 4
              type: array
              items:
                type: string
                enum:
                - same_identity
                - allow
                - restrict
                - escalate
            approverRoles:
              default:
              - owner
              - admin
              - analyst
              minItems: 1
              maxItems: 3
              type: array
              items:
                type: string
                enum:
                - owner
                - admin
                - analyst
          additionalProperties: false
        monitoringIntervalHours:
          default: 24
          anyOf:
          - type: number
            const: 6
          - type: number
            const: 24
          - type: number
            const: 168
        retentionTrigger:
          default: review_completed
          type: string
          enum:
          - review_completed
          - relationship_ended
          - business_event
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
        environment:
          type: string
          enum:
          - sandbox
          - production
        createdAt:
          type: string
          format: date-time
      required:
      - name
      - purpose
      - jurisdictions
      - requiredSources
      - optionalSources
      - exclusions
      - externalChecks
      - review
      - monitoringIntervalHours
      - retentionTrigger
      - id
      - version
      - environment
      - createdAt
      additionalProperties: false
    Subject:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 300
          description: Name to compare with publisher records. Leading and trailing whitespace is removed; provide the fullest reliable name available.
        entityType:
          default: person
          type: string
          enum:
          - person
          - organization
          - vessel
          - aircraft
          - other
          description: Type of subject. Defaults to person when omitted. Every selected source must support this type.
        identifiers:
          default: []
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                minLength: 1
                maxLength: 80
                description: Identifier scheme, such as passport, national_id, registration, lei, imo or mmsi. Matching normalizes supported scheme aliases.
              value:
                type: string
                minLength: 1
                maxLength: 160
                description: Identifier value. Send the original value; scheme-specific normalization is applied during matching.
              issuer:
                type: string
                minLength: 1
                maxLength: 100
                description: Optional issuing authority or country. Omit when unknown; do not send null.
            required:
            - type
            - value
            additionalProperties: false
          description: Typed identifiers used for exact matching, such as passport, national_id, registration, lei, imo or mmsi. Defaults to an empty array. Use the publisher’s identifier scheme; custom scheme names are accepted.
        birthDate:
          anyOf:
          - type: string
            pattern: ^(?!0000)\d{4}$
          - type: string
            pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
          - type: string
            allOf:
            - pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            - pattern: ^(?!0000)
          description: 'Known date or partial date: YYYY, YYYY-MM or YYYY-MM-DD. Preserve known precision; do not invent a month or day. Year 0000 and invalid dates are rejected.'
        country:
          type: string
          minLength: 2
          maxLength: 100
          description: Known country name or code used as supporting identity evidence. It is not a source-selection or geographic coverage filter.
      required:
      - name
      additionalProperties: false
