openapi: 3.2.0
info:
  title: SanctionsKit Reports API
  version: 1.0.0
  description: Explore success and error examples without an account or API key. Recorded examples use isolated synthetic application data; remaining examples are labeled contract fixtures. Potential-match screening is for review. No-match is limited to selected, qualified sources. Sandbox uses synthetic records and is never billed. Each successfully completed subject consumes one allowance unit, including monitoring rescreens. Failed rows and idempotent retries do not consume additional units.
servers:
- url: /api/v1
  description: This site origin; deployment configuration and access rules apply
tags:
- name: Reports
paths:
  /reports:
    get:
      operationId: get__reports
      summary: Read current backlog and period screening and reviewer activity
      tags:
      - Reports
      description: 'Required API key scope: results:read.


        Open, overdue, unassigned and pending-approval cases are the current backlog across all dates; screenings, completed case cohorts and human review activity use the selected period. Superseded cases are excluded from active work. Renewed reviews measure time from their latest review cycle.'
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive calendar date in timeZone (UTC when omitted). Defaults to 29 calendar days before today. from must not be later than to; at most 366 calendar days per report.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive calendar date in timeZone (UTC when omitted). Defaults to today. from must not be later than to; at most 366 calendar days per report.
      - in: query
        name: timeZone
        schema:
          type: string
          default: UTC
          maxLength: 100
        description: Named IANA timezone, such as America/Denver. Uses local calendar-day boundaries including daylight-saving changes. Omission preserves UTC; raw offsets are rejected.
      responses:
        '200':
          headers:
            X-Request-Id:
              description: Server-generated request correlation identifier.
              schema:
                type: string
                format: uuid
          description: Successful response. JSON object with the required data key. All properties marked required are present, including keys whose value may be null. Unmarked properties can be omitted; clients should tolerate additional response properties.
          content:
            application/json:
              examples:
                recorded_operations:
                  summary: Operational totals from the synthetic documentation workspace
                  description: Recorded from the real application handler against an isolated synthetic database. IDs, times and nonfunctional temporary secrets are normalized. No customer data or live provider request.
                  value:
                    data:
                      from: '2026-09-17'
                      to: '2026-09-17'
                      timeZone: UTC
                      generatedAt: '2026-09-17T12:00:00.000Z'
                      screenings:
                        total: 3
                        potentialMatches: 2
                        noMatches: 1
                        expired: 0
                      cases:
                        open: 1
                        confirmed: 0
                        dismissed: 1
                        overdue: 0
                        pendingApproval: 0
                        unassigned: 1
                      monitoring:
                        active: 0
                        paused: 1
                        overdue: 0
                        failed: 0
                        unread: 0
                      reviews:
                        total: 1
                        reused: 0
                        medianHours: 0
                      reviewers:
                      - actorId: docs-synthetic-reviewer
                        actorEmail: reviewer@example.test
                        decisions: 1
                      sourceCoverage:
                      - sourceId: sandbox-synthetic
                        screenings: 3
                      expiringEvidence: []
                      limitations:
                      - Screening activity and historical confirmed/dismissed case cohorts use the selected creation dates in UTC. Outstanding review work and monitoring health show the entire current portfolio, regardless of the date range.
                      - Expired screening outcomes and source coverage are excluded from outcome and source totals. Missing retained data is not a no-match result.
                      - Open, overdue, pending-approval and unassigned case counts include only cases with current retained screening evidence. Recorded confirmed and dismissed decisions remain in historical totals.
                      - Review duration measures completed human decisions from the start of their review cycle, not analyst working time. Reviewer activity excludes automated case creation and reused decisions. Reviewer and expiry lists show at most 100 entries.
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OperationsReport'
        '400':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**invalid_request** — Correct the request fields, resource identifiers, JSON body or query parameters before retrying.


            **invalid_date_range** — Use valid inclusive from/to calendar dates in the selected timezone, with from no later than to.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  summary: invalid request
                  description: Synthetic error example. Correct the request fields, resource identifiers, JSON body or query parameters before retrying.
                  value:
                    error:
                      code: invalid_request
                      message: The request is invalid.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_date_range:
                  summary: invalid date range
                  description: Synthetic error example. Use valid inclusive from/to calendar dates in the selected timezone, with from no later than to.
                  value:
                    error:
                      code: invalid_date_range
                      message: Choose an inclusive date range of at most 366 days.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '401':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge.
          description: '**authentication_required** — Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.


            **invalid_api_key** — Use an active key for the intended environment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                authentication_required:
                  summary: authentication required
                  description: 'Synthetic error example. Send Authorization: Bearer with a valid API key. An omitted header can produce authentication_required; invalid supplied credentials produce invalid_api_key.'
                  value:
                    error:
                      code: authentication_required
                      message: Sign in to continue.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                invalid_api_key:
                  summary: invalid api key
                  description: Synthetic error example. Use an active key for the intended environment.
                  value:
                    error:
                      code: invalid_api_key
                      message: The API key is invalid, expired, or revoked.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '403':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**permission_denied** — Ask an organization owner to grant the required role or API-key scope.


            **insufficient_scope** — Use a key with the scope stated in this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                permission_denied:
                  summary: permission denied
                  description: Synthetic error example. Ask an organization owner to grant the required role or API-key scope.
                  value:
                    error:
                      code: permission_denied
                      message: Your role does not allow this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
                insufficient_scope:
                  summary: insufficient scope
                  description: Synthetic error example. Use a key with the scope stated in this operation.
                  value:
                    error:
                      code: insufficient_scope
                      message: The API key does not grant this action.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '405':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Allow:
              schema:
                type: string
              description: Comma-separated supported HTTP methods.
          description: '**method_not_allowed** — Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                method_not_allowed:
                  summary: method not allowed
                  description: Synthetic error example. Use a method in the Allow response header. OPTIONS lists supported methods; HEAD follows GET authorization and returns no body.
                  value:
                    error:
                      code: method_not_allowed
                      message: This method is not supported for this endpoint.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '413':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**response_too_large** — Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                response_too_large:
                  summary: response too large
                  description: Synthetic error example. Reduce the requested page size or use the documented segmented case archive. No evidence is silently truncated.
                  value:
                    error:
                      code: response_too_large
                      message: This response exceeds the size limit. Request a smaller page or a segmented export.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '429':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**rate_limited** — Wait for the request window to reset and retry with backoff.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rate_limited:
                  summary: rate limited
                  description: Synthetic error example. Wait for the request window to reset and retry with backoff.
                  value:
                    error:
                      code: rate_limited
                      message: The per-minute request limit has been reached.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '500':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
          description: '**internal_error** — Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                internal_error:
                  summary: internal error
                  description: Synthetic error example. Retry with backoff. For writes reuse the same idempotency key and identical input; include requestId when contacting support.
                  value:
                    error:
                      code: internal_error
                      message: The request could not be completed.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
        '503':
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Server-generated correlation identifier, also returned in error.requestId.
            Retry-After:
              schema:
                type: string
              description: When present, a delay in seconds or an HTTP-date before which the client should not retry. Service-unavailable responses default to a one-second delay unless another safe value is supplied. A usage allowance error may require quota recovery instead of retrying.
          description: '**temporarily_unavailable** — Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                temporarily_unavailable:
                  summary: temporarily unavailable
                  description: Synthetic error example. Honor Retry-After when present and retry with bounded backoff. Follow this endpoint’s retry contract; preserve the same key and input for idempotent writes. Contact support with requestId if the failure persists.
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The service is temporarily unavailable. Retry shortly.
                      requestId: 01234567-89ab-4cde-8f01-23456789abcd
  /reports/screenings:
    get:
      operationId: get__reports_screenings
      summary: Download a bounded screening CSV with explicit expired outcomes
      tags:
      - Reports
      description: 'Required API key scope: results:read.


        Event and expiry values retain ISO UTC precision. Each data row carries the captured report dates and timezone. The download filename and X-Report-Time-Zone, X-Report-From and X-Report-To headers retain this context even for an empty export.'
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Inclusive calendar date in timeZone (UTC when omitted). Defaults to 29 calendar days before today. from must not be later than to; at most 366 calendar days per report.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Inclusive calendar date in timeZone (UTC when omitted). Defaults to today. from must not be later than to; at most 366 calendar days per report.
      - in: query
        name: timeZone
        schema:
          type: string
          default: UTC
          maxLength: 100
        description: Named IANA timezone, such as America/Denver. Uses local calendar-day boundaries including daylight-saving changes. Omission preserves UTC; raw offsets are rejected.
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          default: csv
        description: Download format. Read the corresponding response Content-Type before decoding.
      responses:
        '200':
          headers:
            X-Report-Time-Zone:
              schema:
                type: string
              description: Captured calendar timezone for the exported date range.
            X-Report-From:
              schema:
                type: string
                format: date
              description: Inclusive first calendar date.
            X-Report-To:
              schema:
                type: string
                format: date
              description: Inclusive last calendar date.
            X-Request-Id:
              description: Server-generated request correlation identifier.
              schema:
                type: string
                format: uuid
          description: Successful response. The response is the documented raw JSON or file content, without a data envelope. Check Content-Type before decoding.
          content:
            text/csv:
              examples:
                success:
                  summary: Synthetic success example
                  description: Synthetic contract example, validated against the response schema. Invented data; no live customer, provider request, payment, message or source activation.
                  value: '"Screening ID","Created at (UTC)","Subject (when retained)","Outcome","Review decision","Sources checked","Evidence expires (UTC)"

                    "01234567-89ab-4cde-8f01-23456789abcd","2026-09-17T12:00:00.000Z","Alex Morgan","potential_match","open","sandbox-synthetic","2026-10-17T12:00:00.000Z"'
