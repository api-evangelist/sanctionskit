    Subject:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 300
          description: Name to compare with publisher records. Leading and trailing whitespace is removed; provide the fullest reliable name available.
        entityType:
          default: person
          type: string
          enum:
          - person
          - organization
          - vessel
          - aircraft
          - other
          description: Type of subject. Defaults to person when omitted. Every selected source must support this type.
        identifiers:
          default: []
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                minLength: 1
                maxLength: 80
                description: Identifier scheme, such as passport, national_id, registration, lei, imo or mmsi. Matching normalizes supported scheme aliases.
              value:
                type: string
                minLength: 1
                maxLength: 160
                description: Identifier value. Send the original value; scheme-specific normalization is applied during matching.
              issuer:
                type: string
                minLength: 1
                maxLength: 100
                description: Optional issuing authority or country. Omit when unknown; do not send null.
            required:
            - type
            - value
            additionalProperties: false
          description: Typed identifiers used for exact matching, such as passport, national_id, registration, lei, imo or mmsi. Defaults to an empty array. Use the publisher’s identifier scheme; custom scheme names are accepted.
        birthDate:
          anyOf:
          - type: string
            pattern: ^(?!0000)\d{4}$
          - type: string
            pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
          - type: string
            allOf:
            - pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            - pattern: ^(?!0000)
          description: 'Known date or partial date: YYYY, YYYY-MM or YYYY-MM-DD. Preserve known precision; do not invent a month or day. Year 0000 and invalid dates are rejected.'
        country:
          type: string
          minLength: 2
          maxLength: 100
          description: Known country name or code used as supporting identity evidence. It is not a source-selection or geographic coverage filter.
      required:
      - name
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      description: Failure envelope for every documented non-2xx API response. No data property is returned. Switch on error.code; messages may change.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: Machine-readable failure code. See this operation’s status-specific examples for codes and recovery.
            message:
              type: string
              description: Human-readable explanation. Do not parse this text to control application behavior.
            requestId:
              type: string
              format: uuid
              description: Server correlation ID, also returned in X-Request-Id. Include this ID in support requests.
            details:
              description: Optional JSON details for client and validation failures. Validation failures return an array of { path, message } issues; other 4xx codes may return a code-specific object. Server failures omit details. Never assume this key is present.
              anyOf:
              - type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - path
                  - message
                  properties:
                    path:
                      type: string
                      maxLength: 160
                      description: Dot-separated invalid field path, including array indexes.
                    message:
                      type: string
                      maxLength: 300
                      description: Validation problem for this field.
              - type: object
                additionalProperties: true
              - type:
                - string
                - number
                - boolean
                - 'null'
            detailsTruncated:
              type: boolean
              description: True when only the first 50 validation issues are returned. Validation paths and messages are bounded.
