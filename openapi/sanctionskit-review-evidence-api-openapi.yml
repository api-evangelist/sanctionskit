components:
  schemas:
    Investigation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        screeningId:
          type: string
          format: uuid
        counterpartyId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        decision:
          type: string
          enum:
          - open
          - confirmed
          - dismissed
        revision:
          type: integer
          minimum: 0
        assigneeId:
          anyOf:
          - type: string
          - type: 'null'
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
        dueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        escalatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        requiresSecondReview:
          type: boolean
        reviewState:
          type: string
          enum:
          - open
          - pending_approval
          - approved
          - superseded
        businessDisposition:
          type: string
          enum:
          - pending
          - allow
          - restrict
          - escalate
        reviewStartedAt:
          type: string
          format: date-time
        supersededByScreeningId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        supersededByCaseId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        approvalRequiredByPolicy:
          type: boolean
        approvalRequiredForActions:
          type: array
          items:
            type: string
        approverRoles:
          type: array
          items:
            type: string
        reviewConcern:
          anyOf:
          - type: string
          - type: 'null'
        policyContext:
          anyOf:
          - type: object
            properties:
              id:
                type: string
                format: uuid
              version:
                type: integer
                minimum: 0
              name:
                type: string
              purpose:
                type: string
              exclusions:
                type: array
                items:
                  type: string
            required:
            - id
            - version
            - name
            - purpose
            - exclusions
          - type: 'null'
        decisionHistory:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              screeningId:
                anyOf:
                - type: string
                  format: uuid
                - type: 'null'
              decision:
                type: string
                enum:
                - open
                - confirmed
                - dismissed
              businessDisposition:
                anyOf:
                - type: string
                  enum:
                  - pending
                  - allow
                  - restrict
                  - escalate
                - type: 'null'
              rationale:
                anyOf:
                - type: string
                - type: 'null'
              actorId:
                type: string
              actorLabel:
                anyOf:
                - type: string
                - type: 'null'
              createdAt:
                type: string
                format: date-time
              appliedControls:
                anyOf:
                - $ref: '#/components/schemas/AppliedDecisionControls'
                - type: 'null'
            required:
            - id
            - screeningId
            - decision
            - businessDisposition
            - rationale
            - actorId
            - actorLabel
            - createdAt
            - appliedControls
        decisionHistoryTruncated:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              instructions:
                type: string
              evidenceExample:
                type: string
              reviewConcern:
                type: string
              status:
                type: string
                enum:
                - outstanding
                - completed_externally
                - not_applicable
              evidenceReference:
                type: string
              rationale:
                type: string
              actorId:
                anyOf:
                - type: string
                - type: 'null'
              updatedAt:
                anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            required:
            - label
            - status
            - evidenceReference
            - rationale
            - actorId
            - updatedAt
        checkHistory:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              screeningId:
                type: string
                format: uuid
              label:
                type: string
              status:
                type: string
                enum:
                - outstanding
                - completed_externally
                - not_applicable
              evidenceReference:
                type: string
              rationale:
                type: string
              actorId:
                type: string
              updatedAt:
                type: string
                format: date-time
              expiresAt:
                anyOf:
                - type: string
                  format: date-time
                - type: 'null'
            required:
            - id
            - screeningId
            - label
            - status
            - evidenceReference
            - rationale
            - actorId
            - updatedAt
            - expiresAt
        reuseChallenges:
          type: array
          items:
            type: object
            properties:
              ruleId:
                type: string
              originCaseId:
                type: string
              challengedByCaseId:
                type: string
              actorId:
                type: string
              revokedAt:
                type: string
                format: date-time
              affectedCaseIds:
                type: array
                items:
                  type: string
            required:
            - ruleId
            - originCaseId
            - challengedByCaseId
            - actorId
            - revokedAt
            - affectedCaseIds
        submittedBy:
          anyOf:
          - type: string
          - type: 'null'
        approvedBy:
          anyOf:
          - type: string
          - type: 'null'
        matches:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              screeningId:
                type: string
                format: uuid
              sourceId:
                type: string
              recordId:
                type: string
              identityDecision:
                type: string
                enum:
                - unresolved
                - same
                - different
              businessDecision:
                type: string
                enum:
                - pending
                - allow
                - restrict
                - escalate
              rationale:
                type: string
              reusableUntil:
                anyOf:
                - type: string
