  /audit:
    get:
      operationId: get__audit
      summary: List retained human review decisions
      tags:
      - Review evidence
      description: 'Required API key scope: results:read.


        Read append-only human decision history, newest first. Filter by q or review and follow nextCursor. Notes are replaced with [removed under retention policy] after expiry; evidenceAvailable describes the linked evidence and does not reverse an earlier human decision.'
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        description: Maximum number of items to return. A response may contain fewer items; use its next cursor to decide whether another page exists.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: cursor
        description: Pass nextCursor from the previous page; omit for the first page. Continue until the response cursor is null. Keep the same filters between pages.
        schema:
          type: string
          format: uuid
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
        description: Search retained names or resource IDs.
