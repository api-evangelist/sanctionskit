                - removed
                - changed
              fields:
                type: array
                items:
                  type: string
              before:
                $ref: '#/components/schemas/MonitorRecordPreview'
                description: Prior retained evidence preview; omitted when the record did not exist or prior evidence is unavailable.
              after:
                $ref: '#/components/schemas/MonitorRecordPreview'
                description: Current retained evidence preview; omitted when the record no longer exists or current evidence is unavailable.
            required:
            - sourceId
            - recordId
            - kind
            - fields
          description: 'Bounded change previews: at most 10 per list item or 25 on detail. Use linked retained screening IDs for complete evidence.'
      required:
      - id
      - monitorId
      - monitorName
      - caseId
      - screeningId
      - previousScreeningId
      - kind
      - status
      - createdAt
      - acknowledgedAt
      - errorCode
      - totalChanges
      - evidenceExpired
      - currentEvidenceAvailable
      - previousEvidenceAvailable
      - changes
    Error:
      type: object
      required:
      - error
      description: Failure envelope for every documented non-2xx API response. No data property is returned. Switch on error.code; messages may change.
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: Machine-readable failure code. See this operation’s status-specific examples for codes and recovery.
            message:
              type: string
              description: Human-readable explanation. Do not parse this text to control application behavior.
            requestId:
              type: string
              format: uuid
              description: Server correlation ID, also returned in X-Request-Id. Include this ID in support requests.
            details:
              description: Optional JSON details for client and validation failures. Validation failures return an array of { path, message } issues; other 4xx codes may return a code-specific object. Server failures omit details. Never assume this key is present.
              anyOf:
              - type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - path
                  - message
                  properties:
                    path:
                      type: string
                      maxLength: 160
                      description: Dot-separated invalid field path, including array indexes.
                    message:
                      type: string
                      maxLength: 300
                      description: Validation problem for this field.
              - type: object
                additionalProperties: true
              - type:
                - string
                - number
                - boolean
                - 'null'
            detailsTruncated:
              type: boolean
              description: True when only the first 50 validation issues are returned. Validation paths and messages are bounded.
