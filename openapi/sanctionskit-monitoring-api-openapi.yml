          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          description: Public screening failure code, or null when the event does not represent an error. Infrastructure details are not returned; temporarily_unavailable and screening_failed are generic fallbacks. Unknown future codes must remain a failed or incomplete check, never no_match.
        totalChanges:
          type: integer
          minimum: 0
          description: Total saved changes before preview limits.
        evidenceExpired:
          type: boolean
          description: True if linked current or prior evidence is unavailable under retention; missing preview content is not proof of no change.
        currentEvidenceAvailable:
          type: boolean
        previousEvidenceAvailable:
          type: boolean
        changes:
          type: array
          items:
            type: object
            properties:
