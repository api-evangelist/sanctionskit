    patch:
      operationId: patch__monitoring_id_
      summary: Pause, resume, change cadence or queue a check now using the current revision
      tags:
      - Monitoring
      description: 'Required API key scope: monitors:write.


        Policy-backed monitors use their approved cadence. Resume and immediate retries revalidate current policy and coverage. runNow queues work and does not itself establish a completed result.'
