          - match_added
          - match_removed
          - evidence_changed
          - policy_changed
          - baseline_unavailable
          - screening_failed
          - screening_overdue
          - screening_recovered
          - review_required
        status:
          type: string
          enum:
          - unread
          - acknowledged
