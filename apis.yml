    returns 200 with authorization server https://www.sanctionskit.com and scopes sources:read, screenings:write,
    results:read, usage:read. https://www.sanctionskit.com/resources/mcp returns 200; an invented /resources path
    returns a real 404. The provider''s own validator run was not repeated here.'
