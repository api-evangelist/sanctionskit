aid: sanctionskit
name: SanctionsKit
image: https://www.sanctionskit.com/og/v1/home
description: SanctionsKit provides a comprehensive sanctions screening API and compliance dashboard that enables businesses to screen individuals
  and organizations against global restricted‑party lists, manage investigations, and maintain audit trails. The platform offers batch and real‑time
  screening, case management, and ongoing monitoring with a free sandbox key for developers to test integrations. It serves financial services,
  fintech, trade, logistics, and marketplace sectors, delivering detailed source evidence and customizable alerts.
